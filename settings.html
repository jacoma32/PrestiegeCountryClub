<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a1b14">
  <title>Settings | Prestige Country Club</title>
  <link rel="icon" href="./assets/prestige-crest.webp" type="image/webp">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=Outfit:wght@300;400;500;600;700&amp;display=swap">
  <link rel="stylesheet" href="./homepage.css?v=password-eye1">
  <link rel="stylesheet" href="./settings.css">
  <script type="module" src="./js/settings.js?v=developer1"></script>
  <script type="module" src="./js/password-visibility.js"></script>
</head>
<body>
  <header class="site-header">
    <a href="./" class="site-brand" aria-label="Prestige Country Club homepage">
      <img src="./assets/prestige-crest.webp" width="52" height="52" alt="">
      <span>Prestige</span>
    </a>
    <a id="backLink" class="button" href="./">← Home</a>
  </header>
  <main class="settings">
    <h1>Settings</h1>
    <section aria-labelledby="preferencesTitle">
      <h2 id="preferencesTitle">Game preferences</h2>
      <p>Game preferences are saved in this browser.</p>
      <label class="sound-option"><input id="soundPreference" type="checkbox"> Play game sounds</label>
      <label>Text size
        <select id="textSize">
          <option value="standard">Standard</option>
          <option value="large">Large</option>
          <option value="extra-large">Extra large</option>
        </select>
      </label>
      <label class="sound-option"><input id="minimapPreference" type="checkbox"> Show minimap</label>
      <label class="sound-option"><input id="gridPreference" type="checkbox"> Show putting grid</label>
      <p id="preferencesStatus" class="status" role="status"></p>
    </section>
    <section aria-labelledby="passwordTitle">
      <h2 id="passwordTitle">Change password</h2>
      <p id="accountStatus" role="status">Checking sign-in…</p>
      <form id="passwordForm" hidden>
        <label>Current password
          <input name="currentPassword" type="password" autocomplete="current-password" required>
        </label>
        <label>New password
          <input name="newPassword" type="password" autocomplete="new-password" minlength="6" aria-describedby="newPasswordHint" required>
          <small id="newPasswordHint">Use at least 6 characters. Keep your password somewhere safe because there’s no email reset.</small>
        </label>
        <label>Confirm new password
          <input name="confirmPassword" type="password" autocomplete="new-password" minlength="6" required>
        </label>
        <button class="button gold" type="submit">Change password</button>
      </form>
      <p id="passwordStatus" class="status" role="status"></p>
    </section>
    <section id="developerSettings" aria-labelledby="developerTitle" hidden>
      <h2 id="developerTitle">Developer mode</h2>
      <form id="developerUnlock">
        <label>Developer PIN
          <input id="developerPin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required autocomplete="off">
        </label>
        <button class="button gold" type="submit">Turn on</button>
      </form>
      <div id="developerActions" hidden>
        <button class="button" id="developerOff" type="button">Turn off</button>
        <form id="developerGift">
          <label>Recipient username<input name="username" required pattern="[A-Za-z0-9_]{3,20}"></label>
          <label>Gift<select name="kind"><option value="coins">Coins</option><option value="item">Locker item</option></select></label>
          <label id="giftCoins">Coins<input name="coins" type="number" value="100" min="1" max="100000" required></label>
          <label id="giftItem" hidden>Item<select name="item" disabled></select></label>
          <button class="button gold" type="submit">Send gift</button>
        </form>
      </div>
      <p id="developerStatus" class="status" role="status"></p>
    </section>
  </main>
</body>
</html>
